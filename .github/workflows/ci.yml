name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: FFTW
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y libfftw3-dev libglu1-mesa libxcursor1 libxft2 libxinerama1
          else brew install fftw; fi

      - name: Build and install FEMd
        run: python -m pip install -v .

      - name: Import
        run: |
          python -c "import femd as fd, importlib.metadata as m; assert fd.__version__ == m.version('femd'); print('femd', fd.__version__, 'fftw', fd.has_fftw(), 'openmp', fd.has_openmp())"

      - name: Run the example notebooks
        env:
          MPLBACKEND: Agg
        run: |
          python -m pip install matplotlib nbconvert ipykernel gmsh
          for nb in examples/*.ipynb; do
            echo "== $nb"
            python -m jupyter nbconvert --to notebook --execute "$nb" --output-dir /tmp/nb --ExecutePreprocessor.timeout=1200
          done

  openmp:
    name: ubuntu-latest, OpenMP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: FFTW
        run: sudo apt-get update && sudo apt-get install -y libfftw3-dev libglu1-mesa libxcursor1 libxft2 libxinerama1
      - name: Build and install FEMd with OpenMP
        run: python -m pip install -v . -C cmake.define.FEMD_OPENMP=ON
      - name: Run the example notebooks with OpenMP
        env:
          MPLBACKEND: Agg
          OPENBLAS_NUM_THREADS: "1"
        run: |
          python -c "import femd as fd; assert fd.has_openmp() and fd.has_fftw()"
          python -m pip install matplotlib nbconvert ipykernel gmsh
          for nb in examples/*.ipynb; do
            echo "== $nb"
            python -m jupyter nbconvert --to notebook --execute "$nb" --output-dir /tmp/nb --ExecutePreprocessor.timeout=1200
          done

  # Pushing a tag such as v0.1.0 makes a GitHub release, once the builds pass. Its notes are
  # .github/release-notes.md, the CHANGELOG entry of this version written there by release.sh.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, openmp]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag against the version and take the release notes
        run: |
          V=$(sed -n 's/^#define FEMD_VERSION "\(.*\)"/\1/p' include/femd/version.hpp)
          test "v$V" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, but version.hpp says $V"; exit 1; }
          if [ -s .github/release-notes.md ]; then cp .github/release-notes.md notes.md; else echo "FEMd $V" > notes.md; fi
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: FEMd ${{ github.ref_name }}
          body_path: notes.md
